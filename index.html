<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>지도 위의 인문학</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===================== 로그인 화면 ===================== -->
  <div id="loginScreen" class="screen">
    <div class="login-card">
      <h1>🗺️ 지도 위의 인문학</h1>
      <p class="subtitle">세계 곳곳의 숨겨진 역사 이야기를 들어보세요</p>

      <input type="email" id="emailInput" placeholder="이메일" />
      <input type="password" id="passwordInput" placeholder="비밀번호" />

      <div class="login-buttons">
        <button id="loginBtn" class="btn-primary">로그인</button>
        <button id="signupBtn" class="btn-secondary">회원가입</button>
      </div>

      <p id="loginError" class="error-text"></p>
    </div>
  </div>

  <!-- ===================== 메인 지도 화면 ===================== -->
  <div id="mainScreen" class="screen hidden">
    <header class="topbar">
      <h2>🗺️ 지도 위의 인문학</h2>
      <div class="user-area">
        <span id="userEmail"></span>
        <button id="myPageBtn" class="btn-small">나의 기록</button>
        <button id="logoutBtn" class="btn-small">로그아웃</button>
      </div>
    </header>

    <div class="map-wrapper">
      <div id="leafletMap"></div>
    </div>

    <p class="hint">📍 지도 위의 마커를 클릭해 그 지역의 역사 이야기를 들어보세요!</p>
  </div>

  <!-- ===================== 일화 모달 ===================== -->
  <div id="storyModal" class="modal hidden">
    <div class="modal-content">
      <h3 id="storyRegionName"></h3>
      <div id="storyLoading" class="hidden">
        <div class="spinner"></div>
        <p>AI가 이야기를 준비하고 있어요...</p>
      </div>
      <p id="storyText"></p>
      <div class="modal-buttons">
        <button id="playTtsBtn" class="btn-primary hidden">🔊 들려주기</button>
        <button id="stopTtsBtn" class="btn-secondary hidden">⏹ 멈추기</button>
        <button id="closeModalBtn" class="btn-small">닫기</button>
      </div>
    </div>
  </div>

  <!-- ===================== 마이페이지 ===================== -->
  <div id="myPageScreen" class="screen hidden">
    <header class="topbar">
      <h2>📖 나의 역사 탐험 기록</h2>
      <button id="backToMapBtn" class="btn-small">지도로 돌아가기</button>
    </header>
    <p id="progressText" class="hint"></p>
    <div id="visitedList" class="visited-list"></div>
  </div>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script src="script.js"></script>
</body>
</html>
